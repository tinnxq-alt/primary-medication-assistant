<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>基层用药助手 Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>基层用药助手 Pro</h1>
<p>药品数据库 · 说明书结构化 · 基层用药参考</p>
</header>


<div class="search-box">

<input id="searchInput" 
placeholder="搜索药品名称、通用名">

<select id="category">
<option value="">全部分类</option>
<option>降压药</option>
<option>降糖药</option>
<option>心血管</option>
<option>抗感染</option>
<option>呼吸系统</option>
<option>消化系统</option>
</select>

<button onclick="searchDrug()">搜索</button>

</div>


<div class="menu">

<button onclick="filterCategory('降压药')">
💊 降压药
</button>

<button onclick="filterCategory('降糖药')">
💉 降糖药
</button>

<button onclick="filterCategory('心血管')">
❤️ 心血管
</button>

<button onclick="filterCategory('抗感染')">
🦠 抗感染
</button>

</div>


<h2>
药品数据库：
<span id="count">0</span> 条
</h2>


<div id="drugList"></div>


<div id="detail" class="hidden">

<div class="card">

<h2 id="detailName"></h2>

<p id="detailContent"></p>

<button onclick="closeDetail()">
关闭
</button>

</div>

</div>


<script src="app.js"></script>

</body>
</html>
