<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="基层用药助手：药品目录、收藏、笔记与离线缓存。仅供医务人员核对资料，不替代诊疗决策。">
  <title>基层用药助手</title>
  <script>try{if(sessionStorage.getItem("primary-medication:view-restore"))document.documentElement.classList.add("restoring-view")}catch{}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header-layout.css">
  <link rel="stylesheet" href="text-mark-fix.css">
</head>
<body>
  <div id="offlineBanner" class="offline-banner" hidden>当前离线：仅可查看本机已缓存资料</div>
  <header class="app-header">
    <button id="backBtn" class="icon-btn" type="button" aria-label="返回" hidden>←</button>
    <div><p class="eyebrow">PRIMARY CARE</p><h1 id="pageTitle">基层用药助手</h1></div>
    <button id="homeBtn" class="icon-btn" type="button" aria-label="首页">⌂</button>
  </header>
  <main class="app-shell">
    <section id="pharmacySwitcher" class="pharmacy-switcher" aria-label="选择药库">
      <button type="button" data-pharmacy-switch="ward" aria-pressed="true"><span>病房药库</span><strong data-pharmacy-count>164</strong></button>
      <button type="button" data-pharmacy-switch="outpatient" aria-pressed="false"><span>门诊药库</span><strong data-pharmacy-count>0</strong></button>
    </section>
    <div id="app" aria-live="polite"></div>
  </main>
  <nav class="bottom-nav" aria-label="主要导航">
    <button type="button" data-route="home"><span>⌂</span>首页</button><button type="button" data-route="categories"><span>▦</span>分类</button><button type="button" data-route="search"><span>⌕</span>搜索</button><button type="button" data-route="favorites"><span>★</span>收藏</button><button type="button" data-route="notebook"><span>✎</span>笔记</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script src="drugs.js" defer></script>
  <script src="outpatient-loader.js" defer></script>
  <script src="outpatient-web-verification.js" defer></script>
  <script src="drug-lookup.js" defer></script>
  <script src="pharmacy-scope.js" defer></script>
  <script src="catalog-data-loader.js" defer></script>
  <script src="app.js" defer></script>
  <script src="outpatient-metadata-ui.js" defer></script>
  <script src="fast-search-ui.js" defer></script>
  <script src="smart-add-fix.js" defer></script>
  <script src="free-smart-source-v11.js" defer></script>
  <script src="notebook-scroll-fix.js" defer></script>
  <script src="mark-notebook-ui.js" defer></script>
  <script src="mark-menu-below-selection.js" defer></script>
  <script src="header-brand.js" defer></script>
</body>
</html>
