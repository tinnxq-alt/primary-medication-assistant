name: Deploy source-grounded medication Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-primary-medication-smart-search
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: https://primary-medication-smart-search.tinnxq.workers.dev
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install and verify Worker
        working-directory: worker
        run: |
          npm ci
          npm run check
          npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Configure OpenAI Web Search secret when available
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured in GitHub Actions; reliable Web Search remains disabled."
            exit 0
          fi
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --config wrangler.jsonc
          echo "OpenAI API key synced to Worker secret storage."

      - name: Wait for deployed Worker version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            HTTP_CODE=$(curl --silent --show-error \
              --max-time 10 \
              -H 'Origin: https://tinnxq-alt.github.io' \
              "$WORKER_URL/health" \
              --output /tmp/worker-health.json \
              --write-out '%{http_code}' || true)
            echo "health attempt $attempt: HTTP ${HTTP_CODE:-curl-error}"
            cat /tmp/worker-health.json 2>/dev/null || true
            echo
            if [ "$HTTP_CODE" = "200" ] && node - <<'NODE'
          const fs = require('fs');
          try {
            const payload = JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'));
            const valid = payload.discovery === 'openai-web-search-source-v10'
              || payload.discovery === 'browser-site-restricted-source-v9';
            process.exit(valid ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_ENV, `SMART_SEARCH_DISCOVERY=${payload.discovery}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SMART_SEARCH_CONFIGURED=${payload.searchProviderConfigured ? 'true' : 'false'}\n`);
          console.log(`active discovery: ${payload.discovery}; configured=${payload.searchProviderConfigured}`);
          NODE
              exit 0
            fi
            sleep 4
          done
          echo "Timed out waiting for Worker propagation" >&2
          exit 1

      - name: Smoke test live instruction retrieval
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SMART_SEARCH_DISCOVERY:-}" != "openai-web-search-source-v10" ]; then
            echo "Reliable OpenAI Web Search is not configured; skip source-discovery smoke test."
            echo "Add repository secret OPENAI_API_KEY and rerun this workflow to activate and verify v10."
            exit 0
          fi

          HTTP_CODE=$(curl --silent --show-error \
            --max-time 75 \
            -X POST "$WORKER_URL/v1/drugs/search" \
            -H 'Origin: https://tinnxq-alt.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"query":"司美"}' \
            --output /tmp/smart-search-smoke.json \
            --write-out '%{http_code}')
          echo "live HTTP status: $HTTP_CODE"
          cat /tmp/smart-search-smoke.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Live Worker returned HTTP $HTTP_CODE" >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/smart-search-smoke.json', 'utf8'));
          if (payload.discovery !== 'openai-web-search-source-v10') {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error(`unexpected discovery mode: ${payload.discovery || 'missing'}`);
          }
          if (payload.generatesClinicalKnowledge !== false || payload.sourceGrounded !== true) {
            throw new Error('Worker must remain source-grounded and must not generate clinical knowledge');
          }
          const trustedHost = host => host === 'ypk.39.net'
            || host === 'yaopinnet.com'
            || host === 'www.yaopinnet.com';
          const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
          const target = candidates.find(item => {
            let host = '';
            try { host = new URL(String(item.sourceUrl || '')).hostname.toLowerCase(); } catch {}
            return String(item.drugName || '').includes('司美格鲁肽')
              && item.category === '降糖药'
              && trustedHost(host)
              && String(item.clinical?.indication || '').trim()
              && String(item.clinical?.dosage || '').trim();
          });
          if (!target) {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error('live OpenAI Web Search smoke did not produce a source-grounded semaglutide candidate');
          }
          for (const item of payload.verificationLinks || []) {
            const host = new URL(item.url).hostname.toLowerCase();
            if (!trustedHost(host)) throw new Error(`untrusted verification source leaked: ${host}`);
          }
          console.log(`live source-grounded candidate ok: ${target.drugName} | ${target.sourceUrl} | ${payload.elapsedMs}ms`);
          NODE
