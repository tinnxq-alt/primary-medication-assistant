name: Deploy source-grounded medication Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-primary-medication-smart-search
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_URL: https://primary-medication-smart-search.tinnxq.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install and verify Worker
        working-directory: worker
        run: |
          npm ci
          npm run check
          npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Wait for deployed Worker version
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            HTTP_CODE=$(curl --silent --show-error \
              --max-time 10 \
              -H 'Origin: https://tinnxq-alt.github.io' \
              "$WORKER_URL/health" \
              --output /tmp/worker-health.json \
              --write-out '%{http_code}' || true)
            echo "health attempt $attempt: HTTP ${HTTP_CODE:-curl-error}"
            cat /tmp/worker-health.json 2>/dev/null || true
            echo
            if [ "$HTTP_CODE" = "200" ] && node - <<'NODE'
          const fs = require('fs');
          try {
            const payload = JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'));
            const valid = payload.discovery === 'hybrid-source-discovery-v12'
              && payload.mode === 'free-verified'
              && payload.trustedOnlineDiscoverySupported === true
              && payload.classificationSchema === 'separate-category-therapeutic-class-v1'
              && payload.requiresPaidApi === false
              && payload.usesOpenAI === false
              && payload.sourceGrounded === true
              && payload.generatesClinicalKnowledge === false;
            process.exit(valid ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              exit 0
            fi
            sleep 4
          done
          echo "Timed out waiting for hybrid trusted-source Worker v12" >&2
          exit 1

      - name: Smoke test free indexed instruction retrieval
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 75 \
            -X POST "$WORKER_URL/v1/drugs/search" \
            -H 'Origin: https://tinnxq-alt.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"query":"司美"}' \
            --output /tmp/smart-search-smoke.json \
            --write-out '%{http_code}')
          echo "live HTTP status: $HTTP_CODE"
          cat /tmp/smart-search-smoke.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Live Worker returned HTTP $HTTP_CODE" >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/smart-search-smoke.json', 'utf8'));
          if (payload.discovery !== 'local-source-index-v12' || payload.requiresPaidApi !== false || payload.usesOpenAI !== false) {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error('hybrid trusted-source v12 mode is not active');
          }
          if (payload.generatesClinicalKnowledge !== false || payload.sourceGrounded !== true) {
            throw new Error('Worker must remain source-grounded and must not generate clinical knowledge');
          }
          const trustedHost = host => host === 'ypk.39.net'
            || host === 'yaopinnet.com'
            || host === 'www.yaopinnet.com';
          const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
          const target = candidates.find(item => {
            let host = '';
            try { host = new URL(String(item.sourceUrl || '')).hostname.toLowerCase(); } catch {}
            return String(item.drugName || '').includes('司美格鲁肽')
              && item.category === '西药'
              && item.therapeuticClass === '降糖药'
              && trustedHost(host)
              && String(item.clinical?.indication || '').trim()
              && String(item.clinical?.dosage || '').trim();
          });
          if (!target) {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error('free v12 smoke did not produce a source-grounded semaglutide candidate');
          }
          console.log(`free indexed candidate ok: ${target.drugName} | ${target.sourceUrl} | ${payload.elapsedMs}ms`);
          NODE

      - name: Report live verification to tracking issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          HEALTH_CODE=$(curl --silent --show-error \
            --max-time 15 \
            -H 'Origin: https://tinnxq-alt.github.io' \
            "$WORKER_URL/health" \
            --output /tmp/report-health.json \
            --write-out '%{http_code}' || true)
          SEARCH_CODE=$(curl --silent --show-error \
            --max-time 75 \
            -X POST "$WORKER_URL/v1/drugs/search" \
            -H 'Origin: https://tinnxq-alt.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"query":"司美"}' \
            --output /tmp/report-search.json \
            --write-out '%{http_code}' || true)

          {
            echo "### Worker v12 可信来源混合检索自动部署验收"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Health HTTP: \`${HEALTH_CODE:-curl-error}\`"
            echo "- Search HTTP: \`${SEARCH_CODE:-curl-error}\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/report-body.md

          node - <<'NODE' >> /tmp/report-body.md
          const fs = require('fs');
          function read(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch { return {}; }
          }
          const health = read('/tmp/report-health.json');
          const payload = read('/tmp/report-search.json');
          const trusted = new Set(['ypk.39.net', 'yaopinnet.com', 'www.yaopinnet.com']);
          const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
          const target = candidates.find(item => {
            let host = '';
            try { host = new URL(String(item.sourceUrl || '')).hostname.toLowerCase(); } catch {}
            return String(item.drugName || '').includes('司美格鲁肽')
              && item.category === '西药'
              && item.therapeuticClass === '降糖药'
              && trusted.has(host)
              && String(item.clinical?.indication || '').trim()
              && String(item.clinical?.dosage || '').trim();
          });
          let targetHost = '';
          if (target) {
            try { targetHost = new URL(String(target.sourceUrl || '')).hostname.toLowerCase(); } catch {}
          }
          console.log(`- discovery: \`${String(health.discovery || 'unknown')}\``);
          console.log(`- requiresPaidApi: \`${health.requiresPaidApi === true}\``);
          console.log(`- usesOpenAI: \`${health.usesOpenAI === true}\``);
          console.log(`- sourceGrounded: \`${payload.sourceGrounded === true}\``);
          console.log(`- generatesClinicalKnowledge: \`${payload.generatesClinicalKnowledge === true}\``);
          console.log(`- 司美格鲁肽可信候选: **${target ? '通过' : '未通过'}**`);
          if (target) {
            console.log(`- 命中: ${String(target.drugName || '').slice(0, 80)} / ${String(target.category || '').slice(0, 20)} / ${String(target.therapeuticClass || '').slice(0, 40)} / \`${targetHost}\``);
            console.log(`- elapsedMs: \`${Number(payload.elapsedMs) || 0}\``);
          }
          NODE

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/45/comments" \
            -f body="$(cat /tmp/report-body.md)" >/dev/null 2>&1 || true
