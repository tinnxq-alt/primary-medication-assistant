name: Deploy source-grounded medication Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-primary-medication-smart-search
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install and verify Worker
        working-directory: worker
        run: |
          npm ci
          npm run check
          npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Smoke test live instruction retrieval
        env:
          WORKER_URL: https://primary-medication-smart-search.tinnxq.workers.dev
        run: |
          sleep 10
          HTTP_CODE=$(curl --silent --show-error \
            --max-time 75 \
            -X POST "$WORKER_URL/v1/drugs/search" \
            -H 'Origin: https://tinnxq-alt.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"query":"司美"}' \
            --output /tmp/smart-search-smoke.json \
            --write-out '%{http_code}')
          echo "live HTTP status: $HTTP_CODE"
          cat /tmp/smart-search-smoke.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Live Worker returned HTTP $HTTP_CODE" >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/smart-search-smoke.json', 'utf8'));
          if (payload.mode !== 'web-instruction-source-extraction-v3') {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error(`unexpected mode: ${payload.mode || 'missing'}`);
          }
          if (payload.discovery !== 'browser-site-restricted-source-v9') {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error(`unexpected discovery mode: ${payload.discovery || 'missing'}`);
          }
          if (payload.generatesClinicalKnowledge !== false || payload.sourceGrounded !== true) {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error('live Worker must remain source-grounded and must not generate clinical knowledge');
          }
          const trustedHost = host => host === 'ypk.39.net'
            || host === 'yaopinnet.com'
            || host === 'www.yaopinnet.com';
          const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
          const target = candidates.find(item => {
            let host = '';
            try { host = new URL(String(item.sourceUrl || '')).hostname.toLowerCase(); } catch {}
            return String(item.drugName || '').includes('司美格鲁肽')
              && item.category === '降糖药'
              && trustedHost(host)
              && String(item.clinical?.indication || '').trim()
              && String(item.clinical?.dosage || '').trim();
          });
          if (!target) {
            console.error(JSON.stringify(payload, null, 2));
            throw new Error(`live smoke failed; trusted hosts: ${(payload.discoveredSourceHosts || []).join(', ') || 'none'}; methods: ${(payload.discoveryMethods || []).join(', ') || 'none'}`);
          }
          for (const item of payload.verificationLinks || []) {
            const host = new URL(item.url).hostname.toLowerCase();
            if (!trustedHost(host)) throw new Error(`untrusted verification source leaked into response: ${host}`);
          }
          console.log(`live trusted source candidate ok: ${target.drugName} | ${target.sourceUrl} | ${payload.elapsedMs}ms`);
          NODE
