name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 药品资料与代码质控
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check catalog-data-loader.js
          node --check fast-search-ui.js
          node --check smart-add-fix.js
          node --check free-smart-source-v11.js
          node --check notebook-scroll-fix.js
          node --check mark-notebook-ui.js
          node --check mark-menu-below-selection.js
          node --check header-brand.js
          node --check outpatient-loader.js
          node --check outpatient-web-verification.js
          node --check outpatient-clinical-supplement.js
          node --check outpatient-clinical-hydration.js
          node --check outpatient-metadata-ui.js
          node --check drug-interactions.js
          node --check drug-lookup.js
          node --check pharmacy-scope.js
          node --check drug-classification.js
          node --check drugs.js
          node --check outpatient-drugs.js
          node --check service-worker.js
          node --check worker/src/index.js
          node --check worker/src/index-v2.js
          node --check worker/src/index-v3.js
          node --check worker/src/index-v4.js
          node --check worker/src/index-v5.js
          node --check worker/src/index-v6.js
          node --check worker/src/index-v7.js
          node --check worker/src/index-v8.js
          node --check worker/src/index-v9.js
          node --check worker/src/index-v10.js
          node --check worker/src/index-v11.js
          node --check worker/src/index-v12.js
          node --check worker/src/free-source-index.js
          node --check worker/test-v11.mjs
          node --check worker/test-v12.mjs
      - name: Catalog audit
        run: node scripts/audit-catalog.mjs
      - name: Catalog permanent deletion tests
        run: node scripts/test-catalog-deletions.mjs
      - name: Drug name lookup tests
        run: node scripts/test-drug-lookup.mjs
      - name: Fast partial-name search tests
        run: node scripts/test-fast-search.mjs
      - name: Smart add autofill tests
        run: node scripts/test-smart-add-fix.mjs
      - name: Drug classification separation tests
        run: node scripts/test-drug-classification.mjs
      - name: Pharmacy scope tests
        run: node scripts/test-pharmacy-scope.mjs
      - name: Outpatient lazy loading tests
        run: node scripts/test-outpatient-loader.mjs
      - name: Outpatient instruction hydration tests
        run: node scripts/test-outpatient-clinical-hydration.mjs
      - name: Drug interaction tests
        run: node scripts/test-drug-interactions.mjs
      - name: Pharmacy notes and editing tests
        run: node scripts/test-pharmacy-notes-and-editing.mjs
      - name: Response performance tests
        run: node scripts/test-response-performance.mjs
      - name: Detail navigation performance tests
        run: node scripts/test-detail-navigation-performance.mjs
      - name: Text mark and notebook tests
        run: node scripts/test-text-mark-fix.mjs
      - name: Notebook delete tests
        run: node scripts/test-notebook-delete.mjs
      - name: Notebook scroll tests
        run: node scripts/test-notebook-scroll.mjs
      - name: Header layout tests
        run: node scripts/test-header-layout.mjs
      - name: Worker tests
        working-directory: worker
        run: npm test
