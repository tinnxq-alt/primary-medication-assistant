name: Diagnose 39 Drug Search

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-39-search.yml"
      - "worker/src/diagnose-39.js"
      - "worker/wrangler.diagnose.jsonc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DIAG_URL: https://primary-medication-search-diagnose.tinnxq.workers.dev
    steps:
      - uses: actions/checkout@v7

      - name: Install Wrangler
        working-directory: worker
        run: npm ci

      - name: Deploy temporary diagnostic Worker
        working-directory: worker
        run: npx wrangler deploy --config wrangler.diagnose.jsonc

      - name: Inspect 39 homepage and search page through Browser binding
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          HTTP_CODE=$(curl --silent --show-error --max-time 70 \
            "$DIAG_URL/" \
            --output /tmp/diag.json \
            --write-out '%{http_code}')
          echo "diagnostic HTTP status: $HTTP_CODE"
          cat /tmp/diag.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

      - name: Delete temporary diagnostic Worker
        if: always()
        working-directory: worker
        run: npx wrangler delete --name primary-medication-search-diagnose --config wrangler.diagnose.jsonc --force || true
